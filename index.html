<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hilt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* VOICE: tense, smoky card-room bluffing; poker meets tarot.
   IDEA: a candle-lit battle table — black force cards in rows, a chip at stake in the middle.
   PICTURE: the table itself: seats around a central chip, your row and hand at the bottom.
   COLOUR and TYPE: deep plum night table, hot magenta lead, orange support, cream white; Archivo Black numerals, Atkinson Hyperlegible body.
   LAYOUT: top bar, table (opponents → arena → you), side rail with log/chat/rules; stacks below 900px. */
:root{color-scheme:dark;--bg:#140e17;--felt:#1f1524;--felt2:#2a1c31;--line:#3d2b45;--ink:#f6ece4;--muted:#b6a3b8;--mag:#e5318f;--mag2:#ff5eae;--org:#f2892a;--cream:#f4ece0;--card:#0d0b0e;--good:#5fd08f;--focus:#ffd166}
:root[data-theme=light]{color-scheme:dark}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;margin:0;line-height:1.05}
.top{display:flex;align-items:center;gap:12px;padding:10px max(3vw,14px);border-bottom:1px solid var(--line);background:#0f0a12;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:"Archivo Black",Impact,sans-serif;font-size:28px;letter-spacing:.02em}
.brand svg{width:26px;height:26px}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--felt2);padding:10px 16px;border-radius:999px;min-height:44px;font-weight:600}
.btn:hover{border-color:var(--mag)}
.btn.pri{background:var(--mag);border-color:var(--mag);color:#fff}
.btn.pri:hover{background:var(--mag2)}
.btn.org{background:var(--org);border-color:var(--org);color:#1a0f05}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text]{background:#0f0a12;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
.note{color:var(--muted);font-size:14px}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,36px) max(3vw,14px)}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center}
.hero h1{font-size:clamp(48px,8vw,96px);color:var(--cream)}
.hero h1 span{color:var(--mag)}
.hero p{font-size:17px;max-width:56ch;color:#e3d4dc}
.fan{position:relative;height:300px}
.fan .card{position:absolute;left:50%;top:30px;transform-origin:50% 120%}
.panels{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:28px}
.panel{background:var(--felt);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h3{font-size:24px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--felt2)}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.12em;color:var(--mag2)}
.err{background:#4a1630;border:1px solid var(--mag);padding:10px 12px;border-radius:10px;margin-top:10px}
/* cards */
.card{--w:84px;width:var(--w);height:calc(var(--w)*1.5);border-radius:calc(var(--w)*.09);background:var(--card);border:2px solid #3a3040;position:relative;flex:none;color:var(--cream);box-shadow:0 6px 14px rgba(0,0,0,.45);overflow:hidden;user-select:none;padding:0;text-align:left;transition:transform .15s,box-shadow .15s}
.card .cv{position:absolute;left:7%;top:4%;font-weight:700;font-size:calc(var(--w)*.17)}
.card .big{position:absolute;inset:auto 0 9% 0;text-align:center;font-family:"Archivo Black",Impact,sans-serif;font-size:calc(var(--w)*.68);line-height:1;letter-spacing:-.02em}
.card.f10 .big{font-size:calc(var(--w)*.5);bottom:12%;letter-spacing:-.05em}
.card .nm{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-weight:700;font-size:calc(var(--w)*.15);letter-spacing:.02em}
.card .gl{position:absolute;left:12%;right:12%;top:16%;height:52%}
.card .gl svg{width:100%;height:100%}
.card.fate{border-color:transparent}
.card.k-BAIT{background:#efe4d3;color:#21161f}
.card.k-CROWS{background:#2b2230;color:#f6ece4}
.card.k-DOVES{background:#d9e6ee;color:#1e2833}
.card.k-FURY{background:var(--org);color:#1f0e02}
.card.k-LEGEND{background:var(--mag);color:#fff}
.card.k-WINTER{background:#f7f7fa;color:#21304a}
.card.back{background:repeating-linear-gradient(45deg,#2a1730 0 6px,#341c3c 6px 12px);border-color:#4b2d55}
.card.back::after{content:"";position:absolute;inset:18%;border:2px solid var(--mag);border-radius:50%;opacity:.7}
.eff{position:absolute;right:6%;top:4%;background:var(--org);color:#1a0d02;border-radius:999px;font-size:calc(var(--w)*.15);font-weight:700;padding:0 .4em}
.card.mini{--w:46px}
.card.mini .cv{display:none}
.card.mini .nm{font-size:9px}
.hand .card{cursor:default}
.hand .card.ok{cursor:pointer}
.hand .card.ok:hover{transform:translateY(-10px);box-shadow:0 0 0 3px var(--mag),0 10px 20px rgba(0,0,0,.5)}
.hand .card.no{filter:brightness(.55) saturate(.6)}
.card.pick{box-shadow:0 0 0 3px var(--org);cursor:pointer;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:translateY(-6px)}}
.card.new{animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-24px) scale(1.06);opacity:0}}
/* chips */
.chip{--s:22px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;border:3px dashed rgba(0,0,0,.35);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 2px 4px rgba(0,0,0,.4);flex:none}
.chip.M{background:var(--mag)}.chip.O{background:var(--org)}.chip.W{background:var(--cream)}
.chip.empty{background:transparent;border:2px dashed var(--line);box-shadow:none}
.chips{display:inline-flex;gap:3px;align-items:center}
/* table */
.game{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:10px max(2vw,10px) 16px;max-width:1500px;margin:0 auto}
.game.withdrawer{grid-template-columns:minmax(0,1fr) 320px}
.board{display:flex;flex-direction:column;gap:10px}
.statusbar{text-align:center}
.status{font-size:19px;font-weight:600;line-height:1.3}
.status b{color:var(--mag2)}
.sub{color:var(--muted);font-size:13px}
.tablewrap{position:relative;height:clamp(400px,calc(100vh - 330px),700px);margin:6px 0 0}
.felt{position:absolute;inset:7% 9%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#5a2453 0%,#3b1840 45%,#2a1130 75%);box-shadow:inset 0 0 0 10px #4a2a1c,inset 0 0 0 13px #7a4a2c,inset 0 0 60px rgba(0,0,0,.6),0 18px 40px rgba(0,0,0,.55)}
.felt::after{content:"";position:absolute;inset:16%;border-radius:50%;border:1px dashed rgba(255,214,235,.14)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2;text-align:center}
.center .chip{--s:64px;border-width:5px}
.center .cap{font-size:13px;color:#e9cfe0;background:rgba(15,10,18,.55);padding:2px 10px;border-radius:999px;max-width:220px}
.center.over{background:rgba(20,10,22,.9);border:1px solid var(--mag);border-radius:18px;padding:16px 22px;gap:10px}
.center.over h2{font-size:clamp(28px,4vw,46px)}
.wslot{position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%)}
.wslot .card{--w:40px}
.trow{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;z-index:3}
.trow .card{--w:44px}
.trow .card+.card{margin-left:-22px}
.trow.mine .card{--w:54px}.trow.mine .card+.card{margin-left:-24px}
.trow .card .cv{display:none}
.trow .card .nm{font-size:8px}
.trow.lastrow{opacity:.5;filter:saturate(.6)}
.trow.lastrow.won{opacity:.85;filter:none}
.wonlbl{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--org)}
.plate{position:absolute;transform:translate(-50%,-50%);background:rgba(18,11,22,.92);border:1px solid var(--line);border-radius:14px;padding:6px 10px;min-width:118px;max-width:170px;z-index:4;transition:box-shadow .2s,border-color .2s}
.plate.turn{border-color:var(--mag);box-shadow:0 0 0 2px var(--mag),0 0 22px rgba(229,49,143,.5)}
.plate.passed{opacity:.6}
.plate.mine{border-color:#6d4d7a}
.plate .pn{display:flex;align-items:center;gap:6px}
.plate .who{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .str{margin-left:auto;font-family:"Archivo Black",Impact,sans-serif;font-size:22px;line-height:1;color:var(--cream)}
.plate .pm{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:3px}
.plate .pm .note{font-size:11px}
.plate .chip{--s:14px!important;border-width:2px}
.hc{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:3px;margin-left:auto}
.hc i{width:9px;height:13px;border-radius:2px;background:#3a1f44;border:1px solid var(--mag)}
.lnk{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:2px 0;min-height:0}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--felt2);color:var(--muted);font-weight:600}
.tag.mag{background:var(--mag);color:#fff}.tag.org{background:var(--org);color:#1a0d02}
.favor{flex:none;display:inline-flex;align-items:center;gap:3px;background:var(--cream);color:#1d1220;border-radius:8px;padding:0 6px 0 3px;font-weight:700;font-size:11px}
.favor svg{width:14px;height:14px}
.tray{background:linear-gradient(180deg,#24172b,#1a111f);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.tray.turn{border-color:var(--mag);box-shadow:0 0 0 1px var(--mag)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;min-height:0}
.acts:empty{display:none}
.hand{display:flex;gap:8px;overflow-x:auto;padding:14px 4px 6px;justify-content:safe center}
.hand .card{--w:88px}
.tgl{display:inline-flex;gap:6px}
.btn.on{background:var(--felt2);border-color:var(--mag)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mag2);margin-left:6px;vertical-align:middle}
.drawer{display:flex;flex-direction:column;gap:10px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 90px);overflow-y:auto}
.dsec{background:var(--felt);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dh h3{font-size:20px}
.dh .lnk{text-decoration:none;font-size:16px;padding:4px 8px}
/* side */
.side{display:flex;flex-direction:column;gap:12px}
.side .panel{padding:12px}
.side h3{font-size:20px}
.log{max-height:260px;overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:3px}
.log div{padding:2px 0;border-bottom:1px solid #2a1f2f}
.log b{color:var(--mag2)}
.chatbox{max-height:200px;overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.chatbox b{color:var(--org)}
.ref{font-size:13px;display:flex;flex-direction:column;gap:6px}
.ref div{display:flex;gap:8px;align-items:flex-start}
.ref .card{--w:30px;border-radius:4px}
.ref .card .nm,.ref .card .cv{display:none}
.seatsel{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
.seatbox{background:var(--felt2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:110px}
.seatbox.mine{border-color:var(--mag)}
.over{background:radial-gradient(ellipse at 50% 0,#5a1d47,#1f1524 70%);border:1px solid var(--mag);border-radius:18px;padding:20px;text-align:center}
.over h2{font-size:clamp(34px,5vw,56px)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f0a12;border:1px solid var(--mag);padding:10px 16px;border-radius:12px;z-index:50;max-width:90vw}

/* player colours, scoreboards, effects, tips */
.plate{background:color-mix(in srgb,var(--pc) 20%,#120b16);border-left:6px solid var(--pc)}
.plate.mine{border-color:#6d4d7a;border-left-color:var(--pc)}
.plate.turn{border-color:var(--mag);border-left-color:var(--pc)}
.trow:empty{display:none}
.trow:not(.lastrow){padding:3px 5px 5px;border-radius:10px;background:color-mix(in srgb,var(--pc) 22%,transparent);box-shadow:inset 0 -3px 0 var(--pc)}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none;display:inline-block;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.game.withscores{grid-template-columns:250px minmax(0,1fr)}
.game.withscores.withdrawer{grid-template-columns:240px minmax(0,1fr) 300px}
.scores{display:flex;flex-direction:column;gap:10px;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 90px);overflow-y:auto}
.sbox{background:var(--felt);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.sbox h4{margin:0 0 6px;font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.sr,.br{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;margin-bottom:3px;background:color-mix(in srgb,var(--pc) 16%,transparent);font-size:14px}
.sr .rk{font-weight:700;color:var(--muted);width:12px;font-size:12px}
.sr .nm,.br .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:7.5em}
.sr .chips{margin-left:auto}.sr .chip{--s:13px!important;border-width:2px}
.sr .nochip{display:none}
.need{font-size:12px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.need.hot{color:#ffd166;font-weight:700}
.need .chip{border-width:2px}
.br .bar{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.08);min-width:30px}
.br .bar i{display:block;height:100%;border-radius:4px;background:var(--pc);transition:width .35s}
.br .bv{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:17px;min-width:1.6em;text-align:right}
.br.pz{opacity:.55}.br.lead{box-shadow:inset 0 0 0 2px var(--mag)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:6px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--mag)}
.fx{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35;padding:6px 8px;border-radius:9px;margin-bottom:5px;background:var(--felt2)}
.fx svg{width:18px;height:24px;flex:none}
.fx.k-WINTER{background:#e9eef7;color:#1d2a40}.fx.k-FURY{background:var(--org);color:#1f0e02}.fx.k-LEGEND{background:var(--mag);color:#fff}
.fx.fav{background:var(--cream);color:#1d1220}.fx.fav svg{width:16px;height:18px}
.fx.stake{background:#0f0a12;border:1px solid var(--line)}
.seen{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
.seen .note{width:100%;font-size:12px}
.sc{font-size:12px;padding:1px 7px;border-radius:999px;background:#0f0a12;color:var(--muted);border:1px solid var(--line)}
.sc.on{color:var(--ink);border-color:var(--mag)}
.tip{position:fixed;z-index:60;max-width:260px;background:#0f0a12;color:var(--ink);border:1px solid var(--mag);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4;box-shadow:0 12px 30px rgba(0,0,0,.6);pointer-events:none;animation:tipin .14s ease-out}
.tip::after{content:"";position:absolute;left:calc(var(--ax) - 7px);bottom:-7px;width:12px;height:12px;background:#0f0a12;border-right:1px solid var(--mag);border-bottom:1px solid var(--mag);transform:rotate(45deg)}
.tip.below::after{bottom:auto;top:-7px;transform:rotate(225deg)}
.tip .th{margin-bottom:3px}.tip .tn{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:16px;color:var(--mag2)}
.tip .tx{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.tip .good{color:var(--good)}.tip .warn{color:#ffd166}
@keyframes tipin{from{opacity:0;transform:translateY(4px)}}
@media(max-width:1100px){.game.withscores,.game.withscores.withdrawer{grid-template-columns:minmax(0,1fr)}.game.withdrawer:not(.withscores){grid-template-columns:minmax(0,1fr)}
 .scores{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:4px;scroll-snap-type:x mandatory}.sbox{flex:0 0 min(300px,86vw);scroll-snap-align:start;max-height:230px;overflow-y:auto}
 .drawer{position:fixed;right:8px;top:70px;bottom:8px;width:min(340px,calc(100vw - 16px));max-height:none;z-index:30;background:rgba(15,10,18,.97);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:-10px 0 30px rgba(0,0,0,.5)}}
.diag{font-size:13px;background:#0f0a12;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;display:flex;flex-direction:column;gap:2px}
.icebox{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.icebox summary{cursor:pointer;font-weight:700}
.icebox textarea{width:100%;font:12px ui-monospace,Menlo,monospace;background:#0f0a12;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}
@media(max-width:1000px){.game.withdrawer{grid-template-columns:minmax(0,1fr)}.drawer{position:fixed;right:8px;top:70px;bottom:8px;width:min(340px,calc(100vw - 16px));max-height:none;z-index:30;background:rgba(15,10,18,.97);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:-10px 0 30px rgba(0,0,0,.5)}}
@media(max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}.fan{height:240px}}
@media(max-width:600px){.top .brand{font-size:0;gap:0}.top .tag{display:none}.top{gap:6px;padding:8px 10px}.tgl .btn,.top .btn.sm{padding:5px 9px;font-size:13px;min-height:34px}.tablewrap{height:clamp(440px,calc(100svh - 290px),560px)}.plate .tag.pz,.plate .nochip{display:none}.felt{inset:6% 4%}.plate{min-width:96px;max-width:124px;padding:5px 7px}.plate .who{font-size:12px}.plate .str{font-size:18px}.trow .card{--w:34px}.trow .card+.card{margin-left:-20px}.trow.mine .card{--w:42px}.trow.mine .card+.card{margin-left:-22px}.center .chip{--s:46px}.hand .card{--w:70px}.status{font-size:16px}.brand{font-size:24px}.tgl .btn{padding:6px 10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== Hilt rules engine (pure; state is plain JSON) =====
const H = (() => {
  const COLORS = ['M', 'O', 'W'];
  const CNAME = { M: 'Magenta', O: 'Orange', W: 'White' };
  const FATE = {
    BAIT: { name: 'Bait', text: 'Discard this and take one force card you played this battle back into your hand. Can’t take Legend.' },
    CROWS: { name: 'Crows', text: 'The battle ends now. Whoever currently has the highest strength wins.' },
    DOVES: { name: 'Doves', text: 'The battle ends now. No one wins; the Favor and the chip stay for the next battle.' },
    FURY: { name: 'Fury', text: 'Double the strength of all your force cards. One Fury per player per battle.' },
    LEGEND: { name: 'Legend', text: 'Worth 10. Not affected by Winter or Fury. Can’t be Baited.' },
    WINTER: { name: 'Winter', text: 'Played in the middle, once per battle. Every force card is worth 1 (2 with Fury).' },
  };
  const clone = o => JSON.parse(JSON.stringify(o));

function effectsHTML(st, names) {

function tipHTML(c, loc) {

function previewTip(st, c) {

  if (st.passed[me]) return '<div class="tx warn">You’ve passed this battle.</div>';

  const before = H.strength(st, me), lead0 = H.leader(st);
  if (k === 'CROWS') return `<div class="tx">${pre}: the battle ends and <b>${lead0 === me ? 'you win' : esc(names[lead0]) + ' wins'}</b> it.</div>`;

  if (k === 'WINTER') t.winter = me;
  else if (k === 'BAIT') { const tg = H.baitTargets(t, me).sort((a, b) => H.faceVal(b) - H.faceVal(a))[0]; if (!tg) return `<div class="tx">${pre}: nothing to take back; it’s just discarded.</div>`; t.rows[me] = t.rows[me].filter(x => x !== tg); }

}

function statusLine(st, names, me) {
  if (st.phase === 'over') return `<b>${esc(names[st.winner])}</b> ${/^you$/i.test(names[st.winner]) ? 'win' : 'wins'} the game!`;
  const w = H.whoActs(st);
  if (st.phase === 'choose') return w === me ? 'You hold the Favor. <b>Choose the chip</b> to battle over.' : `<b>${esc(names[w])}</b> is choosing the chip.`;
  const alive = st.passed.filter(p => !p).length;
  return (w === me ? '<b>Your turn.</b> Play a card or pass.' : `<b>${esc(names[w])}</b> is thinking…`) + (alive === 1 ? ' <span class="tag org">Everyone else passed</span>' : '');
}
// seat angle around the oval: you at the bottom, then clockwise (to your left first)
function seatPos(k, n) { const a = (90 + 360 * k / n) * Math.PI / 180; return { c: Math.cos(a), s: Math.sin(a) }; }
function plateHTML(st, G, s, names, me, p) {
  const w = H.whoActs(st), seat = G.seats[s];
  const x = 50 + p.c * 43, y = 50 + p.s * 45;
  const hostCtl = isHost() && S.mode === 'online' && seat.kind === 'human' && seat.uid !== myId() ? `<button class="lnk" data-act="takeover" data-i="${s}">bot takes over</button>` : '';
  const reclaimCtl = seat.kind === 'bot' && seat.was === myId() && S.mode === 'online' ? `<button class="lnk" data-act="reclaim" data-i="${s}">take seat back</button>` : '';
  return `<div class="plate ${w === s ? 'turn' : ''} ${st.passed[s] && st.phase === 'battle' ? 'passed' : ''} ${s === me ? 'mine' : ''}" data-seat="${s}" style="left:clamp(64px,${x}%,calc(100% - 64px));top:${y}%;--pc:${pc(s)}">
    <div class="pn"><span class="who">${esc(names[s])}${s === me && !/^you$/i.test(names[s]) ? ' (you)' : ''}</span>${seat.kind === 'bot' ? '<span class="tag">Bot</span>' : ''}${offline(seat) ? '<span class="tag org" title="Not connected right now">offline</span>' : ''}${st.phase === 'battle' && st.furyBy.includes(s) ? '<span class="tag org" title="Fury: force cards double">×2</span>' : ''}<span class="str" title="Strength this battle">${st.phase === 'battle' ? H.strength(st, s) : '·'}</span></div>
    <div class="pm">${st.favor === s ? `<span class="favor" title="Favor: +1 strength, picks the next chip">${HILT_SVG}+1</span>` : ''}${chipsOf(st.chips[s])}<span class="hc" title="Cards in hand">${st.hands[s].length}<i></i></span>${st.passed[s] && st.phase === 'battle' ? '<span class="tag pz">Passed</span>' : ''}</div>
    ${hostCtl}${reclaimCtl}</div>`;
}
function rowHTML(st, s, me, p, showLast) {
  const nar = innerWidth < 600;
  let pos;
  if (nar) { const px = 50 + p.c * 43, py = 50 + p.s * 45; pos = `left:clamp(64px,${px}%,calc(100% - 64px));top:calc(${py}% ${p.s > 0.3 ? '- 66px' : '+ 62px'})`; }
  else pos = `left:${50 + p.c * 25}%;top:${50 + p.s * 25}%`;
  const baitMode = S.ui.bait && s === me && H.whoActs(st) === me;
  let cards, cls = '';
  if (showLast) { const L = st.last; cards = L.rows[s].map(c => cardHTML(c, { loc: 'last:' + s, attr: `data-cid="${c}"` })).join(''); cls = 'lastrow' + (L.winner === s ? ' won' : ''); }
  else cards = st.rows[s].map(c => baitMode && H.isForce(c) ? cardHTML(c, { btn: true, loc: 'row:' + s, cls: 'pick', eff: H.cardVal(st, s, c), attr: `data-act="baitpick" data-card="${c}" data-cid="${c}"` }) : cardHTML(c, { loc: 'row:' + s, eff: H.cardVal(st, s, c), attr: `data-cid="${c}"` })).join('');
  return `<div class="trow ${s === me ? 'mine' : ''} ${cls}" data-row="${s}" style="${pos};--pc:${pc(s)}">${cards}${showLast && st.last.winner === s ? '<span class="wonlbl">won</span>' : ''}</div>`;
}
function drawerHTML(st, names) {
  const P = S.ui.panels;
  const sec = (k, title, body) => P[k] ? `<section class="dsec"><div class="dh"><h3>${title}</h3><button class="lnk" data-act="panel" data-p="${k}" aria-label="Close ${title}">✕</button></div>${body}</section>` : '';
  const any = P.chat || P.log || P.cards;
  if (!any) return '';
  return `<aside class="drawer">
    ${S.mode === 'online' ? sec('chat', 'Chat', `<div class="chatbox" id="chatbox">${chatHTML()}</div><form class="row" data-form="chat"><input type="text" id="chatin" maxlength="300" placeholder="Make a deal…" class="grow"><button class="btn sm">Send</button></form>`) : ''}
    ${sec('log', 'Log', `<div class="log" id="log">${st.log.slice(-40).map(([s, t]) => `<div>${s != null ? `<b style="color:${pc(s)}">${esc(names[s])}</b> ` : ''}${esc(t)}</div>`).join('')}</div>`)}
    ${sec('cards', 'Cards', refHTML())}</aside>`;
}
const offline = seat => !!(S.net && seat && seat.kind === 'human' && seat.uid !== myId() && !(netOnline() || []).includes(seat.uid));
function viewTable() {
  const G = S.G, st = S.st;
  if (!G) return `${topBar(`<span class="code">${esc(S.code || '')}</span>${netPill()}`)}<main class="wrap"><div class="panel"><h3>Table <span class="code">${esc(S.code || '')}</span></h3><p class="note">${esc(S.err || (S.net ? 'Connecting to the host…' : 'Opening table…'))}</p>${netDiag()}<button class="btn" data-act="leave">Back</button></div></main>`;
  const playing = G.status === 'playing' || G.status === 'done';
  const P = S.ui.panels;
  const toggles = playing && st ? `<span class="tgl">${S.mode === 'online' ? `<button class="btn sm ${P.chat ? 'on' : 'ghost'}" data-act="panel" data-p="chat" aria-pressed="${!!P.chat}">Chat${S.unread && !P.chat ? '<i class="dot"></i>' : ''}</button>` : ''}<button class="btn sm ${P.scores !== false ? 'on' : 'ghost'}" data-act="panel" data-p="scores" aria-pressed="${P.scores !== false}">Scores</button><button class="btn sm ${P.log ? 'on' : 'ghost'}" data-act="panel" data-p="log" aria-pressed="${!!P.log}">Log</button><button class="btn sm ${P.cards ? 'on' : 'ghost'}" data-act="panel" data-p="cards" aria-pressed="${!!P.cards}">Cards</button></span>` : '';
  const bar = topBar(`${S.mode === 'online' ? `<span class="tag">Table <span class="code">${G.code}</span></span>${netPill()}` : '<span class="tag">Practice</span>'}${toggles}<button class="btn sm ghost" data-act="leave">Leave</button>`, playing);
  if (G.status === 'lobby' || !st) return bar + viewLobby();
  const names = seatNames(G), me = mySeat(), w = H.whoActs(st);
  const view = me >= 0 ? me : 0;
  const myTurn = me >= 0 && w === me;
  const L = me >= 0 ? H.legal(st, me) : [];
  const showLast = st.last && st.phase !== 'over' && st.rows.every(r => !r.length) && st.winter == null;
  const seats = [...Array(st.n).keys()].map(s => ({ s, p: seatPos((s - view + st.n) % st.n, st.n) }));
  const lead = st.phase === 'battle' && !showLast ? H.leader(st) : null;
  const L2 = st.last;
  const center = st.phase === 'over' ? `<div class="center over"><h2>${esc(names[st.winner])} ${/^you$/i.test(names[st.winner]) ? 'win' : 'wins'}!</h2><div>${chipsOf(st.chips[st.winner])}</div>
      <div class="row" style="justify-content:center">${S.mode === 'local' || isHost() ? '<button class="btn pri" data-act="rematch">Play again</button>' : '<span class="note">The host can start a rematch.</span>'}<button class="btn ghost" data-act="leave">Tables</button></div></div>`
    : `<div class="center"><div class="stakechip">${st.chip && st.phase === 'battle' ? chipHTML(st.chip) : '<span class="chip empty"></span>'}</div>
      ${st.winter != null ? `<div class="wslot" data-wslot>${cardHTML('WINTER.mid', { loc: 'mid', attr: 'data-cid="WINTER"' })}</div>` : ''}
      <div class="cap">${showLast ? `Last battle: ${L2.how === 'doves' ? 'Doves, no winner' : esc(names[L2.winner]) + ' won' + (L2.how === 'crows' ? ' by Crows' : '')}${L2.roundEnd ? ' · new deal' : ''}` : lead != null ? `${esc(names[lead])} ${lead === me && /^you$/i.test(names[lead]) ? 'lead' : 'leads'}` : st.chip ? H.CNAME[st.chip] + ' chip' : 'Round ' + st.round}</div></div>`;
  let tray = '';
  if (me >= 0) {
    const baitMode = S.ui.bait && myTurn;
    const hand = st.hands[me].map(c => { const ok = myTurn && st.phase === 'battle' && L.includes(c) && !baitMode; return cardHTML(c, { btn: true, loc: 'hand', cls: ok ? 'ok' : (myTurn && st.phase === 'battle' ? 'no' : ''), attr: (ok ? `data-act="play" data-card="${c}"` : 'disabled tabindex="-1"') + ` data-hid="${c}"` }); }).join('');
    const acts = st.phase === 'choose' && myTurn ? H.COLORS.map(c => `<button class="btn" data-act="chip" data-c="${c}" ${H.chipsLeft(st, c) > 0 ? '' : 'disabled'}>${chipHTML(c, 22)} ${H.CNAME[c]}${H.wouldWinGame(st.chips[me], c) ? ' <span class="tag org">wins it</span>' : ''}</button>`).join('')
      : st.phase === 'battle' && myTurn ? (baitMode ? `<span class="note">Bait: tap a force card in your row to take back.</span><button class="btn sm ghost" data-act="baitcancel">Cancel</button>`
        : `<button class="btn pri" data-act="pass">Pass</button>${H.canDump(st, me) ? `<button class="btn ghost" data-act="dump" title="You have no force cards: show and discard your whole hand">Pass &amp; discard hand</button>` : ''}`) : '';
    tray = `<section class="tray ${myTurn ? 'turn' : ''}"><div class="acts">${acts}</div><div class="hand" role="group" aria-label="Your hand">${hand || '<span class="note">No cards in hand. You sit out until the next deal.</span>'}</div></section>`;
  }
  return `${bar}<div class="game ${P.chat || P.log || P.cards ? 'withdrawer' : ''} ${P.scores !== false ? 'withscores' : ''}">${P.scores !== false ? scoresHTML(st, names, me) : ''}<div class="board">
    <div class="statusbar"><div class="status">${statusLine(st, names, me)}</div><div class="sub">Round ${st.round} · battle ${st.battle || 1} · ${st.deck.length} undealt</div></div>
    <div class="tablewrap n${st.n}"><div class="felt"></div>
      ${center}
      ${seats.map(({ s, p }) => rowHTML(st, s, me, p, showLast)).join('')}
      ${seats.map(({ s, p }) => plateHTML(st, G, s, names, me, p)).join('')}
    </div>
    ${tray}
    </div>${drawerHTML(st, names)}</div>`;
}
// ---------- motion: cards fly from the hand or the player's seat to the table ----------
function snapRects() {
  const m = { hand: {}, plate: {}, row: new Set(), last: S.st && S.st.last ? S.st.last.battle : null };
  document.querySelectorAll('[data-hid]').forEach(e => m.hand[e.dataset.hid] = e.getBoundingClientRect());
  document.querySelectorAll('.plate[data-seat]').forEach(e => m.plate[e.dataset.seat] = e.getBoundingClientRect());
  document.querySelectorAll('.trow [data-cid], [data-wslot] [data-cid]').forEach(e => m.row.add(e.dataset.cid));
  return m;
}
function animateIn(prev) {
  if (!prev || !S.st || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const st = S.st;
  const owner = cid => { if (cid === 'WINTER') return st.winter; for (let s = 0; s < st.n; s++) if (st.rows[s].includes(cid)) return s; return null; };
  document.querySelectorAll('.trow:not(.lastrow) [data-cid], [data-wslot] [data-cid]').forEach(el => {
    const cid = el.dataset.cid; if (prev.row.has(cid)) return;
    const s = owner(cid); if (s == null) return;
    const hid = cid === 'WINTER' ? Object.keys(prev.hand).find(k => k.startsWith('WINTER')) : cid;
    const from = (hid && prev.hand[hid]) || prev.plate[s]; if (!from) return;
    const to = el.getBoundingClientRect();
    const dx = from.left + from.width / 2 - (to.left + to.width / 2), dy = from.top + from.height / 2 - (to.top + to.height / 2);
    const sc = Math.min(1.6, from.width / to.width * (prev.hand[hid] ? 1 : .6));
    el.animate([
      { transform: `translate(${dx}px,${dy}px) scale(${sc}) rotate(${dx > 0 ? 14 : -14}deg)`, opacity: prev.hand[hid] ? 1 : 0.2, zIndex: 9 },
      { transform: `translate(${dx * .15}px,${dy * .15 - 18}px) scale(1.15) rotate(${dx > 0 ? 3 : -3}deg)`, opacity: 1, offset: .75, zIndex: 9 },
      { transform: 'none', opacity: 1, zIndex: 9 }
    ], { duration: 560, easing: 'cubic-bezier(.2,.75,.25,1)' });
  });
  // chip flies to the battle winner
  const L = st.last;
  if (L && L.battle !== prev.last && L.winner != null && prev.last !== undefined) {
    const to = document.querySelector(`.plate[data-seat="${L.winner}"]`), tw = document.querySelector('.tablewrap');
    if (to && tw) {
      const r = to.getBoundingClientRect(), t = tw.getBoundingClientRect();
      const chip = document.createElement('span'); chip.className = 'chip flying ' + L.chip;
      chip.style.cssText = `--s:56px;position:fixed;left:${t.left + t.width / 2 - 28}px;top:${t.top + t.height / 2 - 28}px;z-index:40`;
      document.body.appendChild(chip);
      chip.animate([{ transform: 'scale(1.3)' }, { transform: `translate(${r.left + r.width / 2 - t.left - t.width / 2}px,${r.top + r.height / 2 - t.top - t.height / 2}px) scale(.4)`, opacity: .9 }], { duration: 750, easing: 'cubic-bezier(.5,0,.3,1)' }).onfinish = () => chip.remove();
    }
  }
}
function render() {
  const keep = document.activeElement && document.activeElement.id; const val = keep && document.activeElement.value; const sel = keep && document.activeElement.selectionStart;
  const prev = S.view === 'table' && S.st ? snapRects() : null;
  hideTip();
  $('#app').innerHTML = S.view === 'table' ? viewTable() : viewHome();
  if (keep) { const el = document.getElementById(keep); if (el) { el.focus(); if (val != null && 'value' in el) { el.value = val; try { el.setSelectionRange(sel, sel); } catch (e) {} } } }
  const lg = $('#log'); if (lg) lg.scrollTop = lg.scrollHeight;
  const cb = $('#chatbox'); if (cb) cb.scrollTop = cb.scrollHeight;
  if (S.view === 'table') animateIn(prev && prev.row.size + Object.keys(prev.hand).length + Object.keys(prev.plate).length ? prev : null);
}
let toastT = null;
function toast(m) { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200); }

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, i = +el.dataset.i;
  switch (a) {
    case 'practice': if (!S.name.trim()) S.name = 'You'; startPractice(S.ui.practiceN); break;
    case 'create': createTable(); break;
    case 'join': { const c = (S.ui.join || '').toUpperCase().trim(); if (!/^[A-Z0-9]{5}$/.test(c)) { toast('Codes have five letters or digits.'); break; } openTable(c); break; }
    case 'open': openTable(el.dataset.code); break;
    case 'leave': leave(); break;
    case 'sit': sit(i); break;
    case 'stand': stand(i); break;
    case 'addbot': addBot(i); break;
    case 'nseats': setSeats(+el.dataset.n); break;
    case 'start': startGame(); break;
    case 'takeover': botTakeover(i); break;
    case 'reclaim': reclaim(i); break;
    case 'rematch': rematch(); break;
    case 'copy': { const url = S.net ? location.origin + location.pathname + '#join-' + S.code : ART_URL; const txt = `Join my Hilt table — code ${S.code}${url ? ': ' + url : ''}`; navigator.clipboard.writeText(txt).then(() => toast('Invite copied.'), () => toast('Code: ' + S.code)); break; }
    case 'chip': act({ t: 'chip', color: el.dataset.c }); break;
    case 'pass': act({ t: 'pass' }); break;
    case 'dump': act({ t: 'pass', dump: true }); break;
    case 'play': {
      const c = el.dataset.card, st = S.st, me = mySeat();
      if (H.kind(c) === 'BAIT') { const tg = H.baitTargets(st, me); const vals = new Set(tg.map(H.faceVal)); if (vals.size > 1) { S.ui.bait = c; render(); break; } act({ t: 'play', card: c, target: tg[0] }); break; }
      act({ t: 'play', card: c }); break;
    }
    case 'baitpick': act({ t: 'play', card: S.ui.bait, target: el.dataset.card }); break;
    case 'panel': { const p = el.dataset.p; S.ui.panels[p] = p === 'scores' ? S.ui.panels.scores === false : !S.ui.panels[p]; if (p === 'chat' && S.ui.panels.chat) S.unread = false; ls.set('hilt.panels', JSON.stringify(S.ui.panels)); render(); break; }
    case 'resume-host': resumeHosting(); break;
    case 'ice-save': { S.ui.iceOpen = true; const raw = ($('#icejson') || {}).value || '';
      try { let v = JSON.parse(raw); if (v && !Array.isArray(v) && Array.isArray(v.iceServers)) v = v.iceServers; if (!Array.isArray(v) || !v.length || v.some(x => !x || !x.urls)) throw 0; ls.set('hilt.ice', JSON.stringify(v)); S.ui.iceDraft = JSON.stringify(v); toast('Saved. It’s used the next time you open or join a table.'); }
      catch (err) { toast('That doesn’t look like an ICE server list: a JSON array of {urls, username, credential}.'); }
      render(); break; }
    case 'ice-clear': S.ui.iceOpen = true; try { localStorage.removeItem('hilt.ice'); } catch (e) {} S.ui.iceDraft = ''; toast('Relay server cleared.'); render(); break;
    case 'onlystr': S.ui.onlyStr = el.checked; ls.set('hilt.onlyStr', el.checked ? '1' : ''); render(); break;
    case 'baitcancel': S.ui.bait = null; render(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'name') { S.name = t.value; ls.set('hilt.name', t.value.trim()); }
  if (t.id === 'joincode') { S.ui.join = t.value.toUpperCase(); }
  if (t.id === 'icejson') { S.ui.iceDraft = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'pn') S.ui.practiceN = +t.value;
  if (t.id === 'ns') S.ui.nseats = +t.value;
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'chat') { const i = $('#chatin'); sendChat(i.value); i.value = ''; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'joincode') { e.preventDefault(); document.querySelector('[data-act=join]')?.click(); } });

let rzT=null; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (S.view === 'table') render(); }, 150); });
S.ui.onlyStr = ls.get('hilt.onlyStr') === '1';
render();
initCaps();
}
</script>
